name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.5.0

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      id: init
      run: |
        cd terraform
        terraform init

    - name: Terraform Plan
      id: plan
      run: |
        cd terraform
        terraform plan -input=false -out=tfplan
      continue-on-error: true

    - name: Terraform Plan Status
      if: steps.plan.outcome == 'failure'
      run: exit 1

    - name: Terraform Apply
      id: apply
      run: |
        cd terraform
        terraform apply -auto-approve tfplan
      
    - name: Get EC2 Public IP
      id: ip
      run: |
        cd terraform
        echo "EC2_PUBLIC_IP=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT
        echo "EC2_PUBLIC_DNS=$(terraform output -raw instance_public_dns)" >> $GITHUB_OUTPUT

    - name: Save Terraform Outputs
      run: |
        mkdir -p tf_outputs
        cd terraform
        terraform output -json > ../tf_outputs/tf_outputs.json
      
    - name: Upload Terraform Outputs
      uses: actions/upload-artifact@v3
      with:
        name: terraform-outputs
        path: tf_outputs/
        retention-days: 1

  deploy-application:
    name: Deploy Application
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    
    steps:
    - name: Download Terraform Outputs
      uses: actions/download-artifact@v3
      with:
        name: terraform-outputs
        path: tf_outputs/
    
    - name: Read Terraform Outputs
      id: tf_outputs
      run: |
        EC2_PUBLIC_IP=$(jq -r '.instance_public_ip.value' tf_outputs/tf_outputs.json)
        echo "EC2_PUBLIC_IP=$EC2_PUBLIC_IP" >> $GITHUB_ENV
        echo "EC2_PUBLIC_DNS=$(jq -r '.instance_public_dns.value' tf_outputs/tf_outputs.json)" >> $GITHUB_ENV
    
    - name: Copy Files to EC2
      env:
        EC2_PEM: ${{ secrets.EC2_PEM_KEY }}
      run: |
        # Guardar la clave PEM
        echo "$EC2_PEM" > pc1.pem
        chmod 600 pc1.pem
        
        # Copiar archivos necesarios
        scp -o StrictHostKeyChecking=no -i pc1.pem \
          docker-compose.yml \
          .env \
          ubuntu@${{ env.EC2_PUBLIC_IP }}:/home/ubuntu/
        
        # Ejecutar comandos en el servidor
        ssh -o StrictHostKeyChecking=no -i pc1.pem ubuntu@${{ env.EC2_PUBLIC_IP }} << 'EOF'
          cd /home/ubuntu
          # Asegurarse de que Docker esté en ejecución
          sudo systemctl start docker
          # Detener y eliminar contenedores existentes
          docker-compose down || true
          # Limpiar imágenes sin usar
          docker system prune -af
          # Iniciar los contenedores
          docker-compose up -d
        EOF
        
        # Limpiar la clave PEM
        rm -f pc1.pem
