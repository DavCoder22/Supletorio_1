name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.5.0
  
  # Application Configuration
  DB_NAME: orderdb
  NODE_ENV: production
  
  # Ports
  APP_PORT: 8080
  RABBITMQ_PORT: 5672
  RABBITMQ_MGMT_PORT: 15672
  PROMETHEUS_PORT: 9090
  CADVISOR_PORT: 8080

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      id: init
      run: |
        cd terraform
        terraform init

    - name: Generate terraform.tfvars
      run: |
        cd terraform
        chmod +x load-env.sh
        ./load-env.sh
        cat terraform.tfvars
        
    - name: Terraform Plan
      id: plan
      run: |
        cd terraform
        terraform plan -input=false -out=tfplan
      continue-on-error: true

    - name: Terraform Plan Status
      if: steps.plan.outcome == 'failure'
      run: exit 1

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        cd terraform
        terraform apply -auto-approve -input=false tfplan
      
    - name: Get EC2 Public IP
      id: ip
      run: |
        cd terraform
        echo "EC2_PUBLIC_IP=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT
        echo "EC2_PUBLIC_DNS=$(terraform output -raw instance_public_dns)" >> $GITHUB_OUTPUT

    - name: Save Terraform Outputs
      run: |
        mkdir -p tf_outputs
        cd terraform
        terraform output -json > ../tf_outputs/tf_outputs.json
      
    - name: Upload Terraform Outputs
      uses: actions/upload-artifact@v3
      with:
        name: terraform-outputs
        path: tf_outputs/
        retention-days: 1

  deploy-application:
    name: Deploy Application
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    
    steps:
    - name: Download Terraform Outputs
      uses: actions/download-artifact@v3
      with:
        name: terraform-outputs
        path: tf_outputs/
    
    - name: Read Terraform Outputs
      id: tf_outputs
      run: |
        EC2_PUBLIC_IP=$(jq -r '.instance_public_ip.value' tf_outputs/tf_outputs.json)
        echo "EC2_PUBLIC_IP=$EC2_PUBLIC_IP" >> $GITHUB_ENV
        echo "EC2_PUBLIC_DNS=$(jq -r '.instance_public_dns.value' tf_outputs/tf_outputs.json)" >> $GITHUB_ENV
    
    - name: Generate .env file
      run: |
        cat > .env <<EOL
        # AWS Configuration
        AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION=${{ env.AWS_REGION }}
        
        # Database Configuration
        DB_USERNAME=${{ secrets.DB_USERNAME }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        DB_NAME=${{ env.DB_NAME }}
        
        # MongoDB Configuration
        MONGO_URI=mongodb://${{ secrets.MONGO_USERNAME }}:${{ secrets.MONGO_PASSWORD }}@${{ env.MONGO_ENDPOINT }}/${{ env.DB_NAME }}?retryWrites=true&w=majority
        
        # Redis Configuration
        REDIS_USER=${{ secrets.REDIS_USER }}
        REDIS_PASS=${{ secrets.REDIS_PASS }}
        
        # RabbitMQ Configuration
        RABBITMQ_DEFAULT_USER=${{ secrets.RABBITMQ_USER }}
        RABBITMQ_DEFAULT_PASS=${{ secrets.RABBITMQ_PASS }}
        
        # Application Configuration
        NODE_ENV=${{ env.NODE_ENV }}
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
        
        # Service URLs
        ORDER_SERVICE_URL=http://order-service:${{ env.APP_PORT }}
        SUBTOTAL_SERVICE_URL=http://subtotal-service:${{ env.APP_PORT }}
        DISCOUNT_SERVICE_URL=http://discount-service:${{ env.APP_PORT }}
        TOTAL_SERVICE_URL=http://total-service:${{ env.APP_PORT }}
        NOTIFICATION_SERVICE_URL=http://notification-service:${{ env.APP_PORT }}
        EOL
        
        # Remove leading spaces from .env file
        sed -i 's/^[ \t]*//' .env
        
    - name: Copy Files to EC2
      env:
        EC2_PEM: ${{ secrets.EC2_PEM_KEY }}
      run: |
        # Save PEM key
        echo "$EC2_PEM" > pc1.pem
        chmod 600 pc1.pem
        
        # Copy necessary files
        scp -o StrictHostKeyChecking=no -i pc1.pem \
          docker-compose.yml \
          .env \
          ec2-user@${{ env.EC2_PUBLIC_IP }}:/home/ec2-user/
        
        # Execute commands on the server
        ssh -o StrictHostKeyChecking=no -i pc1.pem ec2-user@${{ env.EC2_PUBLIC_IP }} << 'EOF'
          cd /home/ec2-user
          # Ensure Docker is running
          sudo systemctl start docker
          # Detener y eliminar contenedores existentes
          docker-compose down || true
          # Limpiar imágenes sin usar
          docker system prune -af
          # Iniciar los contenedores
          docker-compose up -d
        EOF
        
        # Limpiar la clave PEM
        rm -f pc1.pem
